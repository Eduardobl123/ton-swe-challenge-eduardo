name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por referência. Empurrar duas vezes seguidas cancela a primeira,
# porque o resultado dela já não interessa a ninguém.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Tipos, lint e formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # A versão vem do .nvmrc, para que máquina e CI não divirjam.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Nenhuma varredura no código de produção
        # Varredura lê a tabela inteira e o custo cresce com a base. Toda
        # consulta desta aplicação tem índice; a checagem impede que a primeira
        # exceção entre sem ninguém notar.
        run: npm run lint:no-scan

  unitarios:
    name: Testes unitários e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testes com gate de cobertura
        run: npm run test:coverage
      - name: Publica o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sobe o DynamoDB Local
        # Usa o mesmo docker-compose do ambiente local. Definir o serviço duas
        # vezes faria o CI e a máquina de quem desenvolve divergirem justamente
        # no que os testes de integração deveriam provar.
        run: docker compose up -d --wait
      - name: Testes contra o banco
        run: npm run test:integration
      - name: Registra o log do banco quando algo falha
        if: failure()
        run: docker compose logs --tail 100

  contrato:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regenera o contrato
        run: npm run openapi:export
      - name: O contrato versionado bate com as rotas
        # Mudar uma rota sem atualizar o documento quebra aqui, e não no
        # consumidor.
        run: git diff --exit-code docs/openapi.json

  build:
    name: Build e tamanho do artefato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tamanho do pacote
        # O tamanho entra direto no cold start do Lambda, então vale ficar
        # visível a cada execução em vez de virar surpresa no deploy.
        run: |
          TAMANHO=$(du -sh dist | cut -f1)
          echo "Pacote: ${TAMANHO}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/

  dependencias:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Falhas de severidade alta ou crítica
        run: npm audit --audit-level=high

  terraform:
    name: Infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Há definição de infraestrutura?
        id: existe
        # A infraestrutura chega na issue #10. Até lá o passo se declara
        # ausente em vez de falhar, e passa a validar sozinho quando os
        # arquivos aparecerem.
        run: |
          if compgen -G "infra/**/*.tf" > /dev/null; then
            echo "encontrado=true" >> "$GITHUB_OUTPUT"
          else
            echo "encontrado=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum arquivo .tf ainda; validação entra com a issue #10." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.existe.outputs.encontrado == 'true'
      - name: Formato
        if: steps.existe.outputs.encontrado == 'true'
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validação
        if: steps.existe.outputs.encontrado == 'true'
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
