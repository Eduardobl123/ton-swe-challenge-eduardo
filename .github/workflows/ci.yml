name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por referência. Em pull request, empurrar de novo cancela a
# anterior, porque o resultado dela já não interessa a ninguém.
#
# Em `main` o cancelamento fica desligado: dois merges seguidos deixariam o
# primeiro commit sem veredito, justamente no ramo cuja proteção exige verde.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  qualidade:
    name: Tipos, lint e formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # A versão vem do .nvmrc, para que máquina e CI não divirjam.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Nenhuma varredura no código de produção
        # Varredura lê a tabela inteira e o custo cresce com a base. Toda
        # consulta desta aplicação tem índice; a checagem impede que a primeira
        # exceção entre sem ninguém notar.
        run: npm run lint:no-scan

  unitarios:
    name: Testes unitários e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testes com gate de cobertura
        run: npm run test:coverage
      - name: Publica o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sobe o DynamoDB Local
        # Usa o mesmo docker-compose do ambiente local. Definir o serviço duas
        # vezes faria o CI e a máquina de quem desenvolve divergirem justamente
        # no que os testes de integração deveriam provar.
        run: docker compose up -d --wait
      - name: Testes contra o banco
        run: npm run test:integration
      - name: Registra o log do banco quando algo falha
        if: failure()
        run: docker compose logs --tail 100

  contrato:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regenera o contrato
        run: npm run openapi:export
      - name: O contrato versionado bate com as rotas
        # Mudar uma rota sem atualizar o documento quebra aqui, e não no
        # consumidor.
        run: git diff --exit-code docs/openapi.json

  build:
    name: Build e tamanho do artefato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tamanho do pacote
        # O tamanho entra direto no cold start do Lambda, então vale ficar
        # visível a cada execução em vez de virar surpresa no deploy.
        run: |
          TAMANHO=$(du -sh dist | cut -f1)
          echo "Pacote: ${TAMANHO}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/

  dependencias:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    # Relata sem bloquear. Um aviso publicado sobre dependência transitiva
    # reprovaria o próximo pull request seja ele qual for, o autor não teria o
    # que corrigir, e a lição aprendida seria ignorar a esteira vermelha. O
    # resultado aparece no resumo da execução e no agendamento diário abaixo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Falhas de severidade alta ou crítica
        run: |
          if npm audit --audit-level=high; then
            echo 'Nenhuma vulnerabilidade de severidade alta ou crítica.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Dependências com vulnerabilidade conhecida'
              echo
              echo 'Não bloqueia este pull request. Corrija em uma mudança própria.'
              echo
              echo '```'
              npm audit --audit-level=high || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  terraform:
    name: Infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descobre os módulos
        id: modulos
        # `find` em vez de glob com `**`: a expansão recursiva do bash depende
        # da opção `globstar`, que vem desligada nestes passos. Com ela
        # desligada o padrão não casa nada, e a validação se desligaria sozinha
        # sem ninguém perceber — portão em verde que não verifica nada é pior
        # que portão nenhum.
        run: |
          MODULOS=$(find infra -name '*.tf' -exec dirname {} \; 2>/dev/null | sort -u)

          if [ -z "$MODULOS" ]; then
            echo "encontrado=false" >> "$GITHUB_OUTPUT"
            echo 'Nenhum arquivo .tf ainda; validação entra com a issue #10.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "encontrado=true" >> "$GITHUB_OUTPUT"
            echo "modulos<<EOF" >> "$GITHUB_OUTPUT"
            echo "$MODULOS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.modulos.outputs.encontrado == 'true'

      - name: Formato
        if: steps.modulos.outputs.encontrado == 'true'
        run: terraform fmt -check -recursive infra

      - name: Validação de cada módulo
        if: steps.modulos.outputs.encontrado == 'true'
        # Um por vez, porque `infra/` guarda apenas subdiretórios: não há módulo
        # raiz ali para inicializar.
        run: |
          echo "${{ steps.modulos.outputs.modulos }}" | while read -r DIR; do
            [ -z "$DIR" ] && continue
            echo "--- $DIR"
            terraform -chdir="$DIR" init -backend=false -input=false
            terraform -chdir="$DIR" validate
          done
