version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Atualizações de correção e menores viajam juntas: abrir um pull request
      # por pacote transformaria a revisão em ruído e ninguém leria nenhum.
      rotina:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
